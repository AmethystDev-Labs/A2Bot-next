<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>一言</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    .bg-layer {
      position: fixed;
      inset: 0;
      background: url('https://source.starrysky.ggff.net/hitokoto-bg.png') center / cover no-repeat;
      z-index: 0;
    }

    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.55);
      z-index: 1;
    }

    .content {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 2rem;
    }

    .quote-wrapper {
      position: relative;
      display: inline-block;
      /* 只保留上下的内边距，左右严格由文字撑开，绝不产生额外空隙 */
      padding: 0.8em 0;
    }

    .quote {
      color: #ffffff;
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: clamp(1.25rem, 3.2vw, 2.25rem);
      font-weight: 700;
      letter-spacing: 0.08em;
      line-height: 1.8;
      /* 关键修复：取消内部的 text-align: center，让容器宽度完美等于最长行的宽度 */
      text-align: left;
      text-shadow: 0 2px 12px rgba(0, 0, 0, 0.45);
    }

    .quote-wrapper::before,
    .quote-wrapper::after {
      position: absolute;
      font-size: 2.4em;
      font-weight: 300;
      color: rgba(255, 255, 255, 0.2);
      line-height: 1;
      pointer-events: none;
      text-shadow: none;
    }

    /* 左上引号：向左探出 0.5em，基于引号自身的字号计算，绝对精准 */
    .quote-wrapper::before {
      content: "『";
      top: 0;
      left: -2em;
    }

    /* 右下引号：向右探出 0.5em */
    .quote-wrapper::after {
      content: "』";
      bottom: 0;
      right: -2.2em;
    }

    .source {
      margin-top: 1.8rem;
      color: rgba(255, 255, 255, 0.6);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      font-size: clamp(0.85rem, 1.4vw, 1rem);
      font-weight: 400;
      letter-spacing: 0.12em;
      text-shadow: 0 1px 6px rgba(0, 0, 0, 0.4);
    }
  </style>
</html>
<body>
  <div class="bg-layer"></div>
  <div class="overlay"></div>
  <div class="content">
    <div class="quote-wrapper">
      <p class="quote">%%HITOKOTO%%</p>
    </div>
    <p class="source">%%FROM%%</p>
  </div>
</body>
</html>
